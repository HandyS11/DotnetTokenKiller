# Categorizes GitHub's auto-generated release notes by pull request label. The PR labels workflow
# (workflows/pr-labels.yml) sets enhancement, bug and documentation from each pull request's title.
# https://docs.github.com/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: Features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
        - github_actions
    - title: Other Changes
      labels:
        - "*"
