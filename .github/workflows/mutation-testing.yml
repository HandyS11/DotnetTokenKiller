name: Mutation Testing

permissions:
  contents: read

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 03:00 UTC
  workflow_dispatch:       # Allow manual runs

# One Stryker run at a time: a manual run waits for the scheduled one (or the other way round) instead of
# running beside it, and never cancels the run in progress. GitHub keeps one pending run per group, so a
# third run queued meanwhile replaces the pending one, which then shows as cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore dependencies
        run: dotnet restore DotnetTokenKiller.slnx

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build DotnetTokenKiller.slnx --no-restore --configuration Release

      - name: Run Stryker
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
        run: dotnet stryker

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ github.run_number }}
          path: StrykerOutput/**/reports/
          retention-days: 90
