name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: get_version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

  test:
    runs-on: ubuntu-latest
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version="$VERSION"

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  pack-rid:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            pack-runner: ubuntu-latest
            test-runner: ubuntu-latest
            test-image: ''
            glibc: true
            run-integration-suite: true
          - rid: linux-arm64
            pack-runner: ubuntu-latest
            test-runner: ubuntu-24.04-arm
            test-image: ''
            glibc: true
            run-integration-suite: false
          # The musl test jobs build with the Alpine image's SDK, which must satisfy global.json.
          - rid: linux-musl-x64
            pack-runner: ubuntu-latest
            test-runner: ubuntu-latest
            test-image: mcr.microsoft.com/dotnet/sdk:10.0-alpine
            glibc: false
            run-integration-suite: false
          - rid: linux-musl-arm64
            pack-runner: ubuntu-latest
            test-runner: ubuntu-24.04-arm
            test-image: mcr.microsoft.com/dotnet/sdk:10.0-alpine
            glibc: false
            run-integration-suite: false
          - rid: osx-arm64
            pack-runner: macos-latest
            test-runner: macos-latest
            test-image: ''
            glibc: false
            run-integration-suite: false
    uses: ./.github/workflows/aot-package.yml
    with:
      rid: ${{ matrix.rid }}
      version: ${{ needs.version.outputs.version }}
      pack-runner: ${{ matrix.pack-runner }}
      test-runner: ${{ matrix.test-runner }}
      test-image: ${{ matrix.test-image }}
      glibc: ${{ matrix.glibc }}
      run-integration-suite: ${{ matrix.run-integration-suite }}

  pack-any:
    needs: version
    uses: ./.github/workflows/fallback-package.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    runs-on: ubuntu-latest
    needs: [ version, test, pack-rid, pack-any ]
    permissions:
      id-token: write
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # Only `dotnet nuget push` runs here; nothing restores, so no NuGet cache.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Download the pointer, RID and fallback packages
        uses: actions/download-artifact@v8
        with:
          path: ./downloads

      # The pointer is the source of truth for which RID packages exist: a RID it lists but this
      # release lacks would break every install on that RID, so a missing one fails here.
      - name: Gather packages and native symbols
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp downloads/package-pointer/* artifacts/
          rids="$(unzip -p "artifacts/DotnetTokenKiller.$VERSION.nupkg" tools/any/any/DotnetToolSettings.xml | grep -o 'RuntimeIdentifier="[^"]*"' | cut -d'"' -f2 | tr '\n' ' ' || true)"
          if [ -z "${rids// /}" ]; then
            echo "::error::The pointer package lists no RuntimeIdentifier."
            exit 1
          fi
          echo "RIDS=$rids" >> "$GITHUB_ENV"
          echo "RIDs listed by the pointer: $rids"

          # $rids is a space-separated list; unquoted word splitting is intended.
          for rid in $rids; do
            if [ -d "downloads/package-$rid" ]; then
              cp "downloads/package-$rid/"* artifacts/
            fi
            if [ ! -f "artifacts/DotnetTokenKiller.$rid.$VERSION.nupkg" ]; then
              echo "::error::The pointer lists $rid, but DotnetTokenKiller.$rid.$VERSION.nupkg was not built."
              exit 1
            fi
            if [ "$rid" != "any" ]; then
              if [ ! -d "downloads/symbols-$rid" ]; then
                echo "::error::The pointer lists $rid, but its native symbols (symbols-$rid) were not uploaded."
                exit 1
              fi
              (cd "downloads/symbols-$rid" && zip -qr "$GITHUB_WORKSPACE/artifacts/dtk-$VERSION-$rid-symbols.zip" .)
            fi
          done
          ls -la artifacts

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: HandyS11

      # The pointer goes last. Until it is pushed, `dotnet tool install` keeps resolving the previous
      # version, whose RID packages all exist, so a push that fails part-way breaks no install.
      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          # $RIDS comes from the pointer (see the gather step); unquoted word splitting is intended.
          for rid in $RIDS; do
            dotnet nuget push "artifacts/DotnetTokenKiller.$rid.$VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done
          dotnet nuget push "artifacts/DotnetTokenKiller.$VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

      - name: Publish to GitHub Packages
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          source="https://nuget.pkg.github.com/$OWNER/index.json"
          # $RIDS comes from the pointer (see the gather step); unquoted word splitting is intended.
          for rid in $RIDS; do
            dotnet nuget push "artifacts/DotnetTokenKiller.$rid.$VERSION.nupkg" --source "$source" --api-key "$GITHUB_PACKAGES_TOKEN" --skip-duplicate
          done
          dotnet nuget push "artifacts/DotnetTokenKiller.$VERSION.nupkg" --source "$source" --api-key "$GITHUB_PACKAGES_TOKEN" --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            artifacts/*-symbols.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
