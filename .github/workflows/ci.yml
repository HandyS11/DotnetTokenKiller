name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - develop
  pull_request:
  # GitHub does not backfill events dropped during an Actions outage, so without a manual
  # trigger a run skipped that way stays missing until the next push.
  workflow_dispatch:

# A new push to a pull request cancels its superseded run. Every other run gets a group of its own, so
# nothing cancels or supersedes a push to develop: a shared group would drop a queued run for a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # A normal run takes 5 to 8 minutes.
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Check formatting
        run: dotnet format --no-restore --verify-no-changes

      - name: Test
        env:
          DTK_NODE_REQUIRED: '1'
        run: dotnet test --no-build --configuration Release --verbosity normal

  aot-rids:
    name: AOT RIDs
    uses: ./.github/workflows/aot-rids.yml

  aot:
    name: AOT (${{ matrix.rid }})
    needs: aot-rids
    strategy:
      fail-fast: false
      # The RIDs and their runners live in aot-rids.yml, shared with Publish.
      matrix: ${{ fromJSON(needs.aot-rids.outputs.matrix) }}
    uses: ./.github/workflows/aot-package.yml
    with:
      rid: ${{ matrix.rid }}
      version: 0.0.0-ci
      pack-runner: ${{ matrix.pack-runner }}
      test-runner: ${{ matrix.test-runner }}
      test-image: ${{ matrix.test-image }}
      glibc: ${{ matrix.glibc }}
      run-integration-suite: ${{ matrix.run-integration-suite }}

  fallback:
    name: Fallback (any)
    uses: ./.github/workflows/fallback-package.yml
    with:
      version: 0.0.0-ci
