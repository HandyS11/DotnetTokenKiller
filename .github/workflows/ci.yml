name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - develop
  pull_request:
  # GitHub does not backfill events dropped during an Actions outage, so without a manual
  # trigger a run skipped that way stays missing until the next push.
  workflow_dispatch:

# A new push to a pull request cancels its superseded run. Every other run gets a group of its own, so
# nothing cancels or supersedes a push to develop: a shared group would drop a queued run for a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # A normal run takes 5 to 8 minutes.
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Check formatting
        run: dotnet format --no-restore --verify-no-changes

      - name: Test
        env:
          DTK_NODE_REQUIRED: '1'
        run: dotnet test --no-build --configuration Release --verbosity normal

  aot:
    name: AOT (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            pack-runner: ubuntu-latest
            test-runner: ubuntu-latest
            test-image: ''
            glibc: true
            run-integration-suite: true
          - rid: linux-arm64
            pack-runner: ubuntu-latest
            test-runner: ubuntu-24.04-arm
            test-image: ''
            glibc: true
            run-integration-suite: false
          # The musl test jobs build with the Alpine image's SDK, which must satisfy global.json.
          - rid: linux-musl-x64
            pack-runner: ubuntu-latest
            test-runner: ubuntu-latest
            test-image: mcr.microsoft.com/dotnet/sdk:10.0-alpine
            glibc: false
            run-integration-suite: false
          - rid: linux-musl-arm64
            pack-runner: ubuntu-latest
            test-runner: ubuntu-24.04-arm
            test-image: mcr.microsoft.com/dotnet/sdk:10.0-alpine
            glibc: false
            run-integration-suite: false
          - rid: osx-arm64
            pack-runner: macos-latest
            test-runner: macos-latest
            test-image: ''
            glibc: false
            run-integration-suite: false
          - rid: win-x64
            pack-runner: windows-latest
            test-runner: windows-latest
            test-image: ''
            glibc: false
            run-integration-suite: true
    uses: ./.github/workflows/aot-package.yml
    with:
      rid: ${{ matrix.rid }}
      version: 0.0.0-ci
      pack-runner: ${{ matrix.pack-runner }}
      test-runner: ${{ matrix.test-runner }}
      test-image: ${{ matrix.test-image }}
      glibc: ${{ matrix.glibc }}
      run-integration-suite: ${{ matrix.run-integration-suite }}

  fallback:
    name: Fallback (any)
    uses: ./.github/workflows/fallback-package.yml
    with:
      version: 0.0.0-ci
