name: SonarQube Analysis

permissions:
  contents: read

on:
  push:
    branches:
      - develop
  # See ci.yml: a run dropped during an Actions outage is never replayed on its own.
  workflow_dispatch:

# See ci.yml: only a pull request's superseded run is cancelled, so every push to develop is analyzed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The scanner engine runs on this JDK: `begin` passes sonar.scanner.skipJreProvisioning=true, so the
      # scanner never downloads its own JRE from the SonarQube server. When that download times out, the
      # scanner falls back to JAVA_HOME, and the server's engine needs Java 21 (it provisions OpenJDK 21):
      # on a Java 17 JDK it crashes on startup ("Pipe is broken", exit 134), as RustPlusApi's analysis did.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # A cache entry never changes once saved, so both keys roll over monthly: the analyzers in
      # ~/.sonar/cache and the scanner itself would otherwise stay at whatever the first run fetched.
      - name: Compute the cache month
        id: cache-month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache SonarQube packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-cache-${{ steps.cache-month.outputs.month }}
          restore-keys: ${{ runner.os }}-sonar-cache-

      # A restore-keys match is not a hit, so the install step below updates last month's scanner.
      - name: Cache SonarQube scanner
        id: cache-sonar-scanner
        uses: actions/cache@v6
        with:
          path: ./.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner-${{ steps.cache-month.outputs.month }}
          restore-keys: ${{ runner.os }}-sonar-scanner-

      - name: Install SonarQube scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          ./.sonar/scanner/dotnet-sonarscanner begin /k:"$SONAR_PROJECT_KEY" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="$SONAR_HOST_URL" /d:sonar.scanner.skipJreProvisioning=true /d:sonar.exclusions="samples/**/*,.claude/**/*,benchmarks/**/*" /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" /d:sonar.coverage.exclusions=".claude/**/*,samples/**/*,benchmarks/**/*,docs/**/*,eng/**/*,src/DotnetTokenKiller.Cli/Program.cs,src/DotnetTokenKiller.Domain/Filters/FilterKeys.cs"
          dotnet build DotnetTokenKiller.slnx
          dotnet test DotnetTokenKiller.slnx --no-build --collect:"XPlat Code Coverage" --logger "junit;LogFileName={assembly}.junit.xml" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # Codecov reads test results only as JUnit XML, which it finds by name (`*junit*.xml`), hence the
      # junit logger above (JunitXml.TestLogger, referenced by every test project) instead of trx.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
