name: Bug Report
description: Report a bug or unexpected behaviour
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: input
    id: version
    attributes:
      label: DTK version
      description: Run `dtk --version` and paste the output here.
      placeholder: e.g. 1.2.0
    validations:
      required: true

  - type: input
    id: dotnet
    attributes:
      label: .NET SDK version
      description: Run `dotnet --version` and paste the output here.
      placeholder: e.g. 10.0.100
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 24.04, Windows 11, macOS 15
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command run
      description: The exact `dtk` command you ran.
      placeholder: dtk dotnet build src/MyProject.csproj
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the full terminal output if possible.
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Config file contents, reproduction repo, screenshots, etc.
